name: test
on: [push, pull_request]
jobs:
  test:
    uses: nimbase/setup-nim-action/.github/workflows/test_clue.yml@main
    with:
      nim-version: stable
      pre-install-command: |
        # System libvips for the Nim bindings, which resolve compile flags
        # through `pkg-config ... --cflags/--libs vips` at compile time.
        # MSYS2 UCRT64 is used on Windows so headers, libraries, and .pc
        # files share one coherent prefix.
        case "${RUNNER_OS}" in
          Linux)
            sudo apt-get update
            sudo apt-get install -y libvips-dev
            ;;
          macOS)
            brew install vips
            ;;
          Windows)
            C:/msys64/usr/bin/pacman -Sy --noconfirm
            C:/msys64/usr/bin/pacman -S --noconfirm --needed \
              mingw-w64-ucrt-x86_64-pkg-config \
              mingw-w64-ucrt-x86_64-libvips
            echo "C:/msys64/ucrt64/bin" >> "$GITHUB_PATH"
            ;;
          *)
            echo "unsupported runner OS: ${RUNNER_OS}" >&2
            exit 1
            ;;
        esac
