name: test
on: [push, pull_request]
jobs:
  test:
    uses: nimbase/setup-nim-action/.github/workflows/test_clue.yml@main
    with:
      nim-version: stable
      # No system libraries: shaping (harfnim), compression (archive)
      # and image encode (image) are all pure Nim, so no apt/brew/pacman
      # packages are needed on any runner OS.
